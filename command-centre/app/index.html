<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MedMesh</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--ink:#eef1f7;--muted:#9ca3af;--dim:#6b7280;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.06);
  --sky:#7dd3fc;--sky4:#38bdf8;--blue:#3b82f6;--blue6:#2563eb;--green:#34d399;--red:#ef4444;--redl:#fca5a5;--amber:#fbbf24;--violet:#a78bfa;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;--sans:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,.9,.3,1.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:15.5px/1.45 var(--sans);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(800px 500px at 0% -10%,rgba(37,99,235,.20),transparent 60%),radial-gradient(600px 420px at 110% 10%,rgba(34,211,238,.08),transparent 55%),linear-gradient(180deg,#04060c,#070b16 70%,#080d1b);background-attachment:fixed}
body.tabbed{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.ic{width:20px;height:20px;flex:none}.ic.sm{width:15px;height:15px;vertical-align:-2px}
.sp{flex:1}.row{display:flex;align-items:center;gap:8px}.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono)}.ink{color:var(--ink)}.okc{color:var(--green)}
.pad{padding:16px 18px 24px}.pad.tight{padding-top:4px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(125,211,252,.8);margin:22px 0 10px}.eyebrow.nm{margin:0}
.note{font-size:12.5px;color:var(--dim);margin:12px 0}.err{color:var(--redl);font-size:14px}.warn{color:var(--amber)}
.spacer{height:84px}

/* ---------- screen transitions */
.view.enter{animation:in-fwd .42s var(--ease) both}
.view.enter.back{animation-name:in-back}
@keyframes in-fwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes in-back{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.view.enter .stag{animation:rise .55s var(--ease) both}
.view.enter .stag:nth-child(1){animation-delay:.03s}.view.enter .stag:nth-child(2){animation-delay:.07s}.view.enter .stag:nth-child(3){animation-delay:.11s}.view.enter .stag:nth-child(4){animation-delay:.15s}.view.enter .stag:nth-child(5){animation-delay:.19s}.view.enter .stag:nth-child(6){animation-delay:.23s}.view.enter .stag:nth-child(7){animation-delay:.27s}.view.enter .stag:nth-child(n+8){animation-delay:.31s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.view.enter .opt{animation:rise .45s var(--ease) both}.view.enter .opt:nth-child(2){animation-delay:.05s}.view.enter .opt:nth-child(3){animation-delay:.1s}.view.enter .opt:nth-child(4){animation-delay:.15s}.view.enter .opt:nth-child(n+5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- headers */
.lhdr{padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.lrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ltitle{font-size:31px;line-height:1.08;font-weight:700;letter-spacing:-.035em}
.lsub{color:var(--muted);margin-top:8px;font-size:14.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(37,99,235,.25));font:600 13px var(--sans);letter-spacing:.02em}
.meshpill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--glass);font:600 12px var(--mono);letter-spacing:.02em}
.meshpill i{width:8px;height:8px;border-radius:50%;background:currentColor;position:relative}
.meshpill i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ping 1.8s var(--ease) infinite}
.meshpill.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.07)}
.meshpill.bad{color:var(--redl);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.07)}.meshpill.bad i::after{animation:none}
.meshpill.wait{color:var(--amber)}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(5,7,15,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--line)}
.htitle{flex:1;text-align:center;font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--glass2);flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.9)}.iconbtn.ghost{visibility:hidden}
.offbar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px;border:0;border-bottom:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.08);color:var(--redl);font-size:13px}
.offbar .ic{width:15px;height:15px}

/* ---------- surfaces */
.card{border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(6px)}
.card summary{cursor:pointer;list-style:none}.card summary::-webkit-details-marker{display:none}
.squircle{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;border:1px solid}
.squircle .ic{width:22px;height:22px}.squircle.xs{width:34px;height:34px;border-radius:11px}.squircle.xs .ic{width:17px;height:17px}.squircle.lg{width:58px;height:58px;border-radius:18px}.squircle.lg .ic{width:28px;height:28px}
.squircle.sky{color:var(--sky);background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.28)}
.squircle.blue{color:#93c5fd;background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.32)}
.squircle.green{color:var(--green);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3)}
.squircle.red{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.34)}
.squircle.amber{color:var(--amber);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
.squircle.violet{color:var(--violet);background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.3)}
.otx{display:flex;flex-direction:column;flex:1;min-width:0;text-align:left}.otx b{font-weight:600;font-size:16px;letter-spacing:-.01em}.otx small{color:var(--muted);font-size:13px;margin-top:2px}
.chev{color:var(--dim);width:18px;height:18px}

/* ---------- buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px 16px;margin:10px 0;border-radius:16px;border:1px solid var(--line2);background:var(--glass2);font-weight:600;font-size:15.5px;text-decoration:none;color:var(--ink);transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.975)}.btn:disabled{opacity:.4}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#38bdf8,#2563eb 70%);box-shadow:0 12px 28px -8px rgba(37,99,235,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.danger{border:0;color:#fff;background:linear-gradient(135deg,#f87171,#dc2626 70%);box-shadow:0 12px 28px -8px rgba(220,38,38,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.ghost{background:none}.btn.big{padding:17px;font-size:16.5px;border-radius:18px}.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:10px 0 0}
.btn.glow{border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.08);color:#ddd6fe}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--muted)}
.pill .ic{width:14px;height:14px}.pill.ok{color:#a7f3d0;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}.pill.bad{color:var(--redl);border-color:rgba(239,68,68,.4)}.pill.wait{color:var(--sky)}
.statusline{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex:none}.spin.lg{width:26px;height:26px;border-width:3px;color:var(--sky)}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- role / hero */
.hero{position:relative;height:min(62vh,500px);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.herofade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.15),rgba(5,7,15,0) 30%,rgba(5,7,15,.6) 65%,var(--bg))}
.herotxt{position:absolute;left:0;right:0;bottom:6px;padding:0 20px}
.brand{display:inline-flex;align-items:center;gap:9px;font:700 15px var(--sans);letter-spacing:-.01em}.brand.top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:20px;right:20px;display:flex;z-index:2}
.brand.sm{position:static;font-size:13px}
.logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#38bdf8,#2563eb);box-shadow:0 8px 20px -4px rgba(37,99,235,.7)}
.logo .ic{width:18px;height:18px}.brand.sm .logo{width:24px;height:24px;border-radius:8px}.brand.sm .logo .ic{width:14px;height:14px}
.hero h1{font-size:33px;line-height:1.06;letter-spacing:-.04em;margin:0 0 12px;font-weight:700}
.grad{background:linear-gradient(90deg,#7dd3fc,#60a5fa 50%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0;font-size:15px;max-width:420px}
.rolecard,.method,.placecard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:20px;border:1px solid var(--line);background:var(--glass);transition:transform .18s var(--ease),border-color .2s,background .2s}
.rolecard:active,.method:active,.placecard:active,.tile:active,.gcard:active,.hz:active{transform:scale(.975)}
.rolecard:hover,.method:hover{border-color:var(--line2);background:var(--glass2)}
.method:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stats div,.statrow div{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:center}
.stats b,.statrow b{display:block;font:700 17px var(--mono);letter-spacing:-.02em}.stats small,.statrow small{color:var(--dim);font-size:11.5px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}.statrow b{font-size:24px}

.fshero{padding:calc(16px + env(safe-area-inset-top)) 18px 4px;background:radial-gradient(700px 420px at 0% 0%,rgba(37,99,235,.22),transparent 60%)}
.fshero .brand{display:flex;margin-bottom:26px}
.ghostlink{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border:1px solid var(--line2);background:none;font-size:13px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line2);font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.02)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.fshero h1{font-size:38px;line-height:1.04;letter-spacing:-.045em;font-weight:700;margin:18px 0 14px}
.fshero h1 .grad{background:linear-gradient(90deg,#7dd3fc,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.fshero>p{color:var(--muted);font-size:15.5px;line-height:1.6;margin:0 0 20px}
.aerial3d{position:relative;height:min(60vh,430px);border:1px solid var(--line2);background:radial-gradient(120% 90% at 50% 40%,rgba(37,99,235,.10),transparent 60%),#070a14;overflow:hidden;touch-action:pan-y;cursor:grab}
.aerial3d:active{cursor:grabbing}
.aerial3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.a3lbls{position:absolute;inset:0;pointer-events:none}
.a3lbl{position:absolute;left:0;top:0;font:600 10px var(--mono);letter-spacing:.08em;color:#7dd3fc;white-space:nowrap;padding:2px 5px;transition:color .3s,background .3s;text-shadow:0 0 10px rgba(56,189,248,.6)}
.a3lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:currentColor;opacity:.6}
.a3lbl.sos{color:#fda4af;text-shadow:0 0 10px rgba(244,63,94,.6)}.a3lbl.base{color:#6ee7b7}
.a3lbl.hot{background:rgba(5,7,15,.85);border:1px solid currentColor}
.a3card{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);background:rgba(7,10,20,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.a3card.swap{animation:rise .5s var(--ease)}
.a3n{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(56,189,248,.5);color:var(--sky);font:600 13px var(--mono);background:rgba(56,189,248,.08)}
.a3card>div:nth-child(2){flex:1}.a3card b{font-size:15px}.a3card p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.a3dots{display:flex;flex-direction:column;gap:6px;pointer-events:auto}.a3dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer}.a3dots i.on{background:var(--sky);box-shadow:0 0 8px var(--sky)}
.a3hint{position:absolute;top:10px;right:12px;font:500 10.5px var(--mono);color:var(--dim);letter-spacing:.06em}
.aerial3d.nogl{display:none}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin:16px 0 4px;font-size:13px;color:var(--muted)}.checks span{display:inline-flex;align-items:center;gap:6px}.checks .ic{color:var(--green)}
/* ---------- connect */
.radar{position:relative;width:150px;height:150px;margin:14px auto 10px;display:grid;place-items:center}
.radar span{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(56,189,248,.35);opacity:0;animation:radar 2.6s var(--ease) infinite}
.radar span:nth-child(2){animation-delay:.85s}.radar span:nth-child(3){animation-delay:1.7s}
.radar.busy span{animation-duration:1.2s}.radar.done span{border-color:rgba(52,211,153,.4)}
.radar.idle{width:120px;height:120px}
@keyframes radar{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.radar b{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#38bdf8,#2563eb);box-shadow:0 0 40px rgba(56,189,248,.45)}
.radar.done b{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 0 40px rgba(52,211,153,.45)}
.radar b .ic{width:28px;height:28px}
details.method{display:block;padding:0}details.method summary{display:flex;gap:14px;align-items:center;padding:14px;list-style:none;cursor:pointer}
details.method summary::-webkit-details-marker{display:none}details.method[open] summary .chev{transform:rotate(90deg)}
details.method>*:not(summary){margin-left:14px;margin-right:14px}details.method .btn{width:calc(100% - 28px);margin-bottom:14px}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 7px;font-weight:500}
input,select{display:block;width:100%;margin-top:7px;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--sky4);box-shadow:0 0 0 4px rgba(56,189,248,.15)}
select option{background:#0b1222}
.codein{font:700 26px var(--mono);letter-spacing:.35em;text-align:center;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin:4px 0 8px}
.seg button{flex:1;padding:9px 6px;border:0;border-radius:10px;background:none;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s var(--ease);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 auto;min-width:52px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:14px;transition:all .2s}
.chip.on{border-color:var(--sky4);background:rgba(56,189,248,.15);color:var(--sky)}

/* ---------- patient home */
.alertbar{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:18px;margin:6px 0 4px;border:1px solid;text-align:left}
.alertbar .aico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.alertbar.amber{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.38)}.alertbar.amber .aico{background:rgba(251,191,36,.18);color:var(--amber)}
.alertbar.sky{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.35)}.alertbar.sky .aico{background:rgba(56,189,248,.16);color:var(--sky)}
.alertbar.red{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.55);animation:alarm 1.6s infinite}.alertbar.red .aico{background:var(--red);color:#fff}
.alertbar .otx small{color:var(--ink);opacity:.85}
@keyframes alarm{50%{box-shadow:0 0 0 6px rgba(239,68,68,.12)}}
.sosbox{display:flex;flex-direction:column;align-items:center;margin:18px 0 8px}
.sosbtn{position:relative;width:212px;height:212px;border-radius:50%;border:0;padding:0;background:none;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s var(--spring)}
.sosbtn::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fb7185,#e11d48 45%,#9f1239);box-shadow:0 24px 60px -10px rgba(225,29,72,.75),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -10px 30px rgba(0,0,0,.25)}
.sosbtn::after{content:"";position:absolute;inset:18px;border-radius:50%;box-shadow:0 0 0 0 rgba(244,63,94,.5);animation:sosring 2.4s var(--ease) infinite}
@keyframes sosring{0%{box-shadow:0 0 0 0 rgba(244,63,94,.45)}100%{box-shadow:0 0 0 34px rgba(244,63,94,0)}}
.sosbtn.holding{transform:scale(.94)}.sosbtn.holding::after{animation-duration:.6s}
.sosbtn.nudge{animation:nudge .35s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sosbtn .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}.ring .rbg{stroke:rgba(244,63,94,.18)}.ring .rfg{stroke:#fff;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.sosin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;color:#fff}
.sosin .ic{width:30px;height:30px;margin-bottom:2px}.sosin b{font:800 38px/1 var(--sans);letter-spacing:.06em}.sosin small{font-size:12.5px;opacity:.9;margin-top:5px;font-weight:500}
.sosbox.compact .sosbtn{width:150px;height:150px}.sosbox.compact .sosin b{font-size:28px}.sosbox.compact .sosbtn::before,.sosbox.compact .sosbtn::after{inset:13px}
.soscap{text-align:center;margin:12px 0 0;font-size:14px}
.meshcard{margin:16px 0 4px;padding:14px 16px 10px;border-radius:20px;border:1px solid rgba(56,189,248,.18);background:linear-gradient(160deg,rgba(56,189,248,.07),rgba(37,99,235,.03));cursor:pointer}
.meshcard.off{border-color:var(--line);background:var(--glass)}
.meshstrip{width:100%;height:auto;display:block;margin-top:6px}
.meshstrip .ml{stroke:rgba(255,255,255,.12);stroke-width:2;stroke-dasharray:4 4}
.meshstrip .ml.on{stroke:rgba(56,189,248,.55);animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.meshstrip .mn circle{fill:#111827;stroke:rgba(255,255,255,.2);stroke-width:2}
.meshstrip .mn.on circle{fill:#0c2a3d;stroke:var(--sky4)}.meshstrip .mn.on.base circle{fill:#063524;stroke:var(--green)}.meshstrip .mn.on.me circle{fill:var(--blue);stroke:#fff}
.meshstrip text{fill:var(--muted);font:600 9.5px var(--mono);text-anchor:middle}
.meshstrip .mp{fill:#e0f2fe;filter:drop-shadow(0 0 4px #38bdf8)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);text-align:left;transition:transform .18s var(--ease),background .2s}
.tile .squircle{margin-bottom:9px;width:40px;height:40px;border-radius:13px}.tile b{font-size:15px;font-weight:600}.tile small{color:var(--dim);font-size:12.5px}
.activecase{display:block;width:100%;text-align:left;padding:16px;margin:8px 0 4px;border-radius:22px;border:1px solid rgba(52,211,153,.35);background:linear-gradient(160deg,rgba(52,211,153,.11),rgba(37,99,235,.06));position:relative;overflow:hidden}
.activecase.tri-red{border-color:rgba(239,68,68,.4);background:linear-gradient(160deg,rgba(239,68,68,.12),rgba(37,99,235,.06))}
.activecase .small{display:inline-flex;align-items:center;gap:5px}
.acmain{display:flex;align-items:center;gap:12px;margin:12px 0}
.acmain>div:first-child{flex:1}.acmain b{display:block;font-size:18px;letter-spacing:-.01em}.acmain small{color:var(--muted);font-size:13px}
.bigeta{font:700 38px/1 var(--mono);letter-spacing:-.04em;color:var(--green);text-shadow:0 0 24px rgba(52,211,153,.35)}
.live{display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--mono);letter-spacing:.12em;color:var(--redl)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.phasebar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.phasebar i{height:4px;border-radius:4px;background:rgba(255,255,255,.1);transition:background .4s}.phasebar i.on{background:linear-gradient(90deg,var(--sky4),var(--green))}
.trackrow{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--sky);font-weight:600;font-size:14px}
.upd{display:flex;gap:12px;align-items:flex-start;border-color:rgba(52,211,153,.28);background:rgba(52,211,153,.05)}
.upd.warnc{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05)}
.upd .uic{width:22px;height:22px;color:var(--green);margin-top:1px}.upd.warnc .uic{color:var(--amber)}
.upd p{margin:4px 0 0;color:var(--muted);font-size:14px}.upd>div{flex:1}
div.upd.small{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid rgba(52,211,153,.28);margin-top:10px;color:#a7f3d0}
.eta{font-size:14px;margin-top:3px;color:var(--muted)}.eta b{font-size:18px;color:var(--green)}
.tip{display:flex;gap:12px;align-items:flex-start}.tip .uic{color:var(--sky);width:22px;height:22px}.tip p{margin:0}

/* ---------- tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;width:calc(100% - 24px);max-width:496px;display:flex;align-items:center;justify-content:space-around;padding:7px;border-radius:26px;border:1px solid var(--line2);background:rgba(12,16,28,.78);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 20px 50px -10px rgba(0,0,0,.7)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border:0;background:none;color:var(--dim);font-size:10.5px;font-weight:600;border-radius:18px;transition:color .2s}
.tab .ic{width:22px;height:22px;transition:transform .25s var(--spring)}
.tab.on{color:var(--ink)}.tab.on .ic{color:var(--sky);transform:translateY(-1px) scale(1.08)}
.tab.on::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--sky)}
.tab em{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--sans);font-style:normal}
.sostab{flex:none;width:58px;height:58px;margin:-26px 6px 0;border-radius:50%;border:4px solid #0a0e1a;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 50% 30%,#fb7185,#e11d48 55%,#9f1239);box-shadow:0 10px 26px -4px rgba(225,29,72,.8);transition:transform .2s var(--spring)}
.sostab:active{transform:scale(.9)}.sostab .ic{width:24px;height:24px}

/* ---------- toasts */
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:100;width:calc(100% - 24px);max-width:496px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;border:1px solid var(--line2);background:rgba(17,22,36,.88);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 20px 40px -12px rgba(0,0,0,.8);animation:tin .5s var(--spring) both;cursor:pointer}
.toast.out{animation:tout .3s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-16px) scale(.97)}}
.toast .tico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.toast b{font-size:14.5px}.toast p{margin:1px 0 0;font-size:13px;color:var(--muted)}
.toast.green .tico{background:rgba(52,211,153,.18);color:var(--green)}.toast.red .tico{background:var(--red);color:#fff}.toast.red{border-color:rgba(239,68,68,.45)}
.toast.sky .tico{background:rgba(56,189,248,.18);color:var(--sky)}.toast.amber .tico{background:rgba(251,191,36,.18);color:var(--amber)}

/* ---------- questionnaire */
.qhdr{gap:12px}
.segs{flex:1;display:flex;gap:4px}.segs i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.1);transition:background .35s}
.segs i.done{background:var(--sky4)}.segs i.cur{background:linear-gradient(90deg,var(--sky4) 50%,rgba(255,255,255,.12) 50%);background-size:200% 100%;animation:fillseg 1.4s ease-in-out infinite alternate}
@keyframes fillseg{from{background-position:100% 0}to{background-position:40% 0}}
.tri{display:inline-flex;align-items:center;font:700 10.5px var(--mono);letter-spacing:.08em;padding:4px 9px;border-radius:8px;white-space:nowrap;transition:all .3s}
.tri.red{background:rgba(239,68,68,.2);color:#fecaca;box-shadow:inset 0 0 0 1px rgba(239,68,68,.5)}.tri.yellow{background:rgba(251,191,36,.16);color:#fde68a;box-shadow:inset 0 0 0 1px rgba(251,191,36,.45)}
.tri.green{background:rgba(52,211,153,.14);color:#a7f3d0;box-shadow:inset 0 0 0 1px rgba(52,211,153,.45)}.tri.black{background:#27272a;color:#e4e4e7;box-shadow:inset 0 0 0 1px #52525b}
.tri.blue{background:rgba(59,130,246,.16);color:#bfdbfe;box-shadow:inset 0 0 0 1px rgba(59,130,246,.45)}.tri.ghost{color:var(--dim);box-shadow:inset 0 0 0 1px var(--line2)}
.qhdr .tri{animation:pop .4s var(--spring)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.qpad{padding-top:18px}
.qh{font-size:27px;line-height:1.12;letter-spacing:-.03em;margin:0 0 18px;font-weight:700}
h2{font-size:22px;letter-spacing:-.02em;margin:6px 0 14px;font-weight:650}
.opts{display:grid;gap:10px}.opts.grid{grid-template-columns:1fr 1fr}
.opts.grid .opt{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}.opts.grid .opt .radio{position:absolute;top:12px;right:12px}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:20px;border:1px solid var(--line2);background:var(--glass);transition:transform .18s var(--ease),border-color .2s,background .2s,opacity .25s}
.opt:active{transform:scale(.975)}
.oic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--sky);flex:none;transition:all .25s}
.opt .otx b{font-size:16.5px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .25s var(--spring)}
.radio .ic{width:13px;height:13px;opacity:0;transform:scale(.4);transition:all .25s var(--spring)}
.opt.danger{border-color:rgba(239,68,68,.35)}.opt.danger .oic{color:#fca5a5;background:rgba(239,68,68,.12)}
.opt.sel{border-color:var(--sky4);background:rgba(56,189,248,.12);transform:scale(.985)}
.opt.sel .radio{background:var(--sky4);border-color:var(--sky4)}.opt.sel .radio .ic{opacity:1;transform:none;color:#04121f}
.opt.sel .oic{background:var(--sky4);color:#04121f}
.opt.danger.sel{border-color:var(--red);background:rgba(239,68,68,.15)}.opt.danger.sel .radio,.opt.danger.sel .oic{background:var(--red);border-color:var(--red);color:#fff}
.opts.picked .opt:not(.sel){opacity:.35}
.tricard{border-radius:24px;padding:20px;text-align:center;margin:0 0 12px;position:relative;overflow:hidden;animation:pop .5s var(--spring)}
.tricard small{display:block;font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.tricard b{display:block;font:800 34px/1.1 var(--sans);letter-spacing:.04em;margin:6px 0 4px}.tricard span{font-size:14px;opacity:.9}
.tricard.red{background:radial-gradient(circle at 50% 0%,#f87171,#b91c1c 60%,#7f1d1d);box-shadow:0 20px 50px -14px rgba(220,38,38,.8)}
.tricard.yellow{background:radial-gradient(circle at 50% 0%,#fbbf24,#b45309 60%,#78350f)}.tricard.green{background:radial-gradient(circle at 50% 0%,#34d399,#047857 60%,#064e3b)}.tricard.black{background:radial-gradient(circle at 50% 0%,#71717a,#27272a)}
.list{padding:4px 16px}.list>div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list>div:last-child{border:0}.list>div>.ic{color:var(--sky);width:18px;height:18px}.list span{color:var(--muted);width:92px;flex:none}.list b{font-weight:500;flex:1;text-align:right}
.packet{padding:12px 14px;border-radius:16px;border:1px dashed var(--line2);margin:12px 0}
.packet code{display:block;margin-top:8px;font:12px/1.5 var(--mono);color:var(--sky);word-break:break-all}
.bytebar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}.bytebar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--sky4),var(--green));transition:width .5s var(--ease)}
.slider{position:relative;height:66px;margin:18px 0 6px;border-radius:999px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.slider .sfill{position:absolute;left:0;top:0;bottom:0;width:66px;background:linear-gradient(90deg,#b91c1c,#ef4444);border-radius:999px}
.slider .slabel{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:.02em;color:#fecaca;padding-left:40px;opacity:calc(1 - var(--p,0) * 1.4);background:linear-gradient(90deg,#fecaca 30%,#fff 50%,#fecaca 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.2s linear infinite}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.slider .knob{position:absolute;left:4px;top:4px;width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;color:#b91c1c;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4);touch-action:none;z-index:2}
.slider .knob .ic{width:24px;height:24px}.slider.drag .knob{transform-origin:center}
.slider.go{background:#16a34a;border-color:#16a34a}.slider.go .sfill{background:linear-gradient(90deg,#16a34a,#22c55e)}

/* ---------- sent / hop viz */
.sentcard{border-radius:24px;padding:16px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(56,189,248,.08),rgba(37,99,235,.03));margin-bottom:6px}
.sentcard h2{margin:12px 0 4px;font-size:21px}
.hopviz{width:100%;height:auto;display:block;margin:6px 0 2px}
.hopviz .hl{stroke:rgba(255,255,255,.14);stroke-width:3;stroke-dasharray:5 5}.hopviz .hl.on{stroke:var(--sky4);stroke-dasharray:none;filter:drop-shadow(0 0 4px rgba(56,189,248,.6))}
.hopviz .hn circle{fill:#111827;stroke:rgba(255,255,255,.22);stroke-width:2.5;transition:all .4s}
.hopviz .hn.on circle{fill:#0369a1;stroke:var(--sky)}.hopviz .hn.on.base circle{fill:#047857;stroke:var(--green);filter:drop-shadow(0 0 8px rgba(52,211,153,.7))}
.hopviz .hk{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hopviz text{fill:var(--muted);font:600 10px var(--mono);text-anchor:middle}
.hopviz .hp{fill:#fff;filter:drop-shadow(0 0 6px #38bdf8)}
.pathline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}.pathline b{color:var(--sky);font-weight:600}
.timeline{display:grid;margin:14px 0 6px;padding-left:8px}
.timeline>div{position:relative;padding:4px 0 16px 26px;color:var(--dim);border-left:2px solid var(--line2)}
.timeline>div:last-child{border-left-color:transparent;padding-bottom:4px}
.timeline>div i{position:absolute;left:-9px;top:4px;width:16px;height:16px;border-radius:50%;background:#111827;border:2px solid var(--line2);transition:all .35s var(--spring)}
.timeline b{display:block;font-weight:600;font-size:14.5px}.timeline small{font-size:12.5px}
.timeline .done{color:var(--muted);border-left-color:var(--green)}.timeline .done b{color:var(--ink)}
.timeline .done i{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.timeline .fail i{background:var(--red);border-color:var(--red)}
.aid{margin:10px 0 4px;padding-left:20px;color:var(--muted)}.aid li{margin:6px 0}
.dots{display:flex;gap:6px;margin:0 0 18px}.dots i{width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);transition:all .3s}.dots i.on{background:var(--sky4);width:30px}

/* ---------- medical ID card */
.flip{perspective:1200px;margin:6px 0 14px;cursor:pointer}
.flipin{position:relative;height:216px;transition:transform .7s var(--spring);transform-style:preserve-3d}
.flip.on .flipin{transform:rotateY(180deg)}
.idcard{position:absolute;inset:0;border-radius:24px;padding:18px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:radial-gradient(120% 100% at 0% 0%,rgba(125,211,252,.35),transparent 50%),radial-gradient(100% 90% at 100% 100%,rgba(52,211,153,.22),transparent 55%),linear-gradient(135deg,#0c2a52,#0b1730 60%,#08101f);border:1px solid rgba(125,211,252,.3);box-shadow:0 30px 60px -20px rgba(37,99,235,.55),inset 0 1px 0 rgba(255,255,255,.15)}
.idcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.1) 45%,transparent 55%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,60%{background-position:120% 0}100%{background-position:-60% 0}}
.chipico{width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#d97706);opacity:.85}
.idcard .mid{font:700 30px var(--mono);letter-spacing:.24em;color:#e0f2fe;margin:20px 0 4px;text-shadow:0 0 20px rgba(125,211,252,.5)}
.idname{font-size:16px;font-weight:600}
.idmeta{display:flex;gap:20px;margin-top:14px}.idmeta small{display:block;font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(224,242,254,.6)}.idmeta b{font-size:14px}.idmeta .blood{color:#fca5a5;font-size:17px}
.idcard.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.idcard.back canvas{width:150px!important;height:150px!important;border-radius:14px;background:#fff;padding:6px}
.idcard.back small{color:rgba(224,242,254,.7)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:6px 0}
.form{padding:2px 16px 16px}

/* ---------- scan */
.scanbox{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:3/4}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .frame{position:absolute;inset:20%;border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.45);border:3px solid var(--sky4);overflow:hidden}
.scanbox .frame i{position:absolute;left:0;right:0;height:2px;background:var(--sky);box-shadow:0 0 12px var(--sky);animation:scanline 2s ease-in-out infinite alternate}
@keyframes scanline{from{top:4%}to{top:94%}}

/* ---------- responder / jobs */
.job{position:relative;padding:16px 16px 14px 20px;margin:12px 0;border-radius:22px;border:1px solid var(--line);background:var(--glass);overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.job.tri-red::before{background:var(--red);box-shadow:0 0 16px var(--red)}.job.tri-yellow::before{background:var(--amber)}.job.tri-green::before{background:var(--green)}.job.tri-black::before{background:#71717a}.job.tri-blue::before{background:var(--blue)}
.job.tri-red{border-color:rgba(239,68,68,.25)}.job.dim{opacity:.55}
.job h3{display:flex;align-items:center;gap:9px;margin:12px 0 10px;font-size:19px;letter-spacing:-.02em}.job h3 .ic{width:22px;height:22px;color:var(--sky)}
.legs{display:grid;gap:6px;margin-bottom:10px}
.legs>div{display:flex;align-items:center;gap:9px;font-size:14px}.legs>div .ic{color:var(--muted)}.legs span{color:var(--muted)}.legs b{margin-left:auto;font-weight:600;text-align:right}
.etarow{display:flex;gap:16px;padding:11px 13px;border-radius:14px;background:rgba(0,0,0,.25);margin:4px 0 10px}
.etarow small{display:block;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.etarow b{font:700 19px var(--mono);color:var(--green);letter-spacing:-.02em;white-space:nowrap}
.etarow .via{min-width:0}.etarow .via span{font-size:13px;color:var(--ink);word-break:break-word}
.reroute{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:14px;margin:8px 0;background:rgba(59,130,246,.12);border:1px solid rgba(96,165,250,.45);animation:pop .5s var(--spring)}
.reroute .ic{color:#93c5fd}.reroute b{display:block;color:#bfdbfe;font-size:14px}.reroute small{color:var(--muted);font-size:12.5px}
.stepper3{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stepper3>i{position:absolute;left:4px;top:4px;bottom:4px;border-radius:12px;background:linear-gradient(90deg,rgba(52,211,153,.25),rgba(52,211,153,.12));transition:width .5s var(--spring);min-width:calc(33.3% - 4px)}
.stepper3 button{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 4px;border:0;border-radius:12px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.stepper3 button.on{color:#a7f3d0}.stepper3 button:disabled{cursor:default}
.emptyart{text-align:center;padding:28px 16px;color:var(--muted)}
.emptyart>b:first-child:not(:only-child){display:block}.emptyart>b .ic{width:34px;height:34px;color:var(--dim)}
.emptyart>b{display:block;color:var(--ink);font-size:16px;margin-top:6px}.emptyart.small{padding:18px}
.emptyart .radar{margin-bottom:6px}
.roadpick{position:relative}.roadpick select{appearance:none;-webkit-appearance:none;font-weight:600;padding-right:40px}.roadpick .chev{position:absolute;right:14px;top:50%;transform:translateY(-30%) rotate(90deg);pointer-events:none}
.hazards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hz{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);text-align:left;transition:all .2s var(--ease)}
.hz .squircle{margin-bottom:8px;width:40px;height:40px}.hz b{font-size:15px}.hz small{color:var(--dim);font-size:12px}
.hz.sel{border-color:var(--sky4);background:rgba(56,189,248,.12);transform:scale(.97)}

/* ---------- hospital / pharmacy */
.openchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 12px var(--sans);color:var(--redl);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35)}
.openchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.openchip.on{color:var(--green);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35)}.openchip.warnc{color:var(--amber);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35)}
.capcard{padding:16px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.gauges>div{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px;border-radius:18px;background:rgba(0,0,0,.22)}
.gauge{position:relative;width:118px;height:118px}.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9}.gauge .gbg{stroke:rgba(255,255,255,.07)}.gauge .gfg{stroke-linecap:round;transition:stroke-dashoffset .6s var(--spring);filter:drop-shadow(0 0 6px currentColor)}
.gauge>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge b{font:700 34px/1 var(--mono);letter-spacing:-.04em}.gauge small{color:var(--muted);font-size:11.5px;margin-top:3px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
.stepper button{width:42px;height:40px;border:0;background:none;display:grid;place-items:center;transition:background .15s}
.stepper button:active{background:rgba(255,255,255,.12)}.stepper button .ic{width:17px;height:17px}
.stepper span{min-width:38px;text-align:center;font:700 16px var(--mono)}
.capchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:none;font-size:13.5px;font-weight:500;color:var(--muted);transition:all .2s}
.cchip.on{color:#bfdbfe;border-color:rgba(59,130,246,.55);background:rgba(59,130,246,.16)}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.14);border:0;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:left .3s var(--spring)}
.switch.on{background:var(--green)}.switch.on::after{left:23px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:25;width:calc(100% - 24px);max-width:496px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:22px;border:1px solid var(--line2);background:rgba(14,19,32,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 40px -12px rgba(0,0,0,.8);transition:border-color .3s}
.dock>div{flex:1;min-width:0}.dock b{display:block;font-size:14px}.dock small{color:var(--muted);font-size:12px}
.dock .btn{width:auto;margin:0;padding:11px 18px}
.dock.dirty{border-color:rgba(251,191,36,.55);animation:dockin .4s var(--spring)}.dock.dirty b{color:var(--amber)}
@keyframes dockin{from{transform:translateX(-50%) translateY(10px)}}
.stockrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.stockrow:last-child{border:0}
.sinfo{flex:1;min-width:0}.sinfo b{font-size:14px;font-weight:600}
.sbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}.sbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f59e0b,#fbbf24);transition:width .4s var(--spring)}.sbar i.low{background:var(--red)}

/* ---------- maps */
.navmap{position:relative;height:56vh;min-height:320px}
.navmap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.navmap.tall{height:54vh}
.navbadge{position:absolute;left:14px;top:14px;padding:10px 14px;border-radius:16px;background:rgba(10,14,26,.82);border:1px solid var(--line2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.navbadge b{display:block;font:700 24px var(--mono);color:var(--green);letter-spacing:-.03em}.navbadge b.sm{font:600 15px var(--sans);color:var(--ink)}.navbadge small{color:var(--muted);font-size:12px}
.sheet{position:relative;margin-top:-26px;padding:10px 18px 28px;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#0b1020,#070b16);border-top:1px solid var(--line2);box-shadow:0 -20px 40px rgba(0,0,0,.5)}
.grab{display:block;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.trackh{font-size:23px;margin:10px 0 12px}
.ambrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.ambrow b{display:block;font-size:15px}.ambrow small{color:var(--muted);font-size:12px}.ambrow .right{text-align:right}
.navsteps>div{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.navsteps>div:last-child{border:0}
.turn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(59,130,246,.15);color:#93c5fd}.turn .ic{width:18px;height:18px}.turn.end{background:rgba(52,211,153,.15);color:var(--green)}
.minimap{position:relative;height:210px;margin:12px 18px 6px;border-radius:22px;overflow:hidden;border:1px solid var(--line2)}
.minimap canvas{position:absolute;inset:0;width:100%;height:100%}
.placecard .otx b{font-size:15px}
.dist{font:700 17px var(--mono);color:var(--sky);text-align:right;white-space:nowrap}.dist small{font-size:11px;color:var(--dim);margin-left:2px}

/* ---------- first aid */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);text-align:left;transition:transform .18s var(--ease)}
.gcard .squircle{margin-bottom:9px;width:40px;height:40px}.gcard b{font-size:14.5px}.gcard small{color:var(--dim);font-size:12px;line-height:1.35}
.gcard.cprhero{grid-column:span 2;flex-direction:row;align-items:center;gap:14px;border-color:rgba(239,68,68,.35);background:linear-gradient(135deg,rgba(239,68,68,.14),rgba(239,68,68,.03))}
.gcard .otx b{font-size:14.5px}.gcard .otx small{margin-top:2px}.gcard.cprhero .squircle{margin:0}.gcard.cprhero .otx b{font-size:17px}
.guidehead{display:flex;gap:14px;align-items:center;margin:4px 0 16px}.guidehead b{display:block;font-size:21px;letter-spacing:-.02em}.guidehead small{color:var(--muted)}
.gsteps{list-style:none;padding:0;margin:12px 0 16px;display:grid;gap:8px}
.gsteps li{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:15px;cursor:pointer;transition:all .25s var(--ease)}
.gsteps .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 12px var(--mono);background:rgba(255,255,255,.08);transition:all .25s var(--spring)}
.gsteps .num .ic{width:14px;height:14px}
.gsteps li.done{opacity:.6;border-color:rgba(52,211,153,.3)}.gsteps li.done .num{background:var(--green);color:#04120c}.gsteps li.done>span:last-child{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.cprbox{text-align:center;padding:20px 16px 8px;border-radius:24px;border:1px solid rgba(239,68,68,.35);background:radial-gradient(circle at 50% 30%,rgba(239,68,68,.16),rgba(239,68,68,.03));margin-bottom:16px}
.cprbeat{width:150px;height:150px;margin:0 auto 12px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 46px/1 var(--mono);background:radial-gradient(circle at 50% 30%,#f87171,#b91c1c 65%,#7f1d1d);color:#fff;box-shadow:0 20px 50px -12px rgba(220,38,38,.8)}
.cprbeat small{font:600 11px var(--sans);opacity:.85;margin-top:4px;letter-spacing:.04em}
.cprbeat.pulse{animation:beat .3s var(--ease)}
@keyframes beat{0%{transform:scale(1.14);box-shadow:0 0 0 18px rgba(239,68,68,.25)}100%{transform:scale(1)}}
.cprcount{font:600 15px var(--sans);margin-bottom:2px;color:var(--muted)}

/* ---------- safe */
.safebtns{display:grid;gap:12px;margin-top:18px}
.safebig{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:20px;border-radius:24px;border:1px solid;text-align:left;transition:transform .18s var(--ease)}
.safebig:active{transform:scale(.97)}.safebig .ic{width:30px;height:30px;margin-bottom:8px}.safebig b{font-size:20px;letter-spacing:-.02em}.safebig small{color:var(--muted)}
.safebig.green{border-color:rgba(52,211,153,.4);background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(52,211,153,.03));color:var(--ink)}.safebig.green .ic{color:var(--green)}
.safebig.amber{border-color:rgba(251,191,36,.4);background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(251,191,36,.03))}.safebig.amber .ic{color:var(--amber)}
.donebox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;margin:16px 0 0;border-radius:24px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.06);animation:pop .5s var(--spring)}
.donebox.amber{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.06)}
.bigcheck{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#04120c;box-shadow:0 0 0 8px rgba(52,211,153,.15)}
.donebox.amber .bigcheck{background:var(--amber);box-shadow:0 0 0 8px rgba(251,191,36,.15)}.bigcheck .ic{width:32px;height:32px}
.donebox b{font-size:18px}

/* ---------- alerts / log / settings */
.alertcard{display:flex;gap:12px;padding:14px;margin:10px 0;border-radius:20px;border:1px solid var(--line);background:var(--glass)}
.alertcard>div{flex:1}.alertcard p{margin:4px 0 0;font-size:14.5px}
.alertcard.red{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}.alertcard.amber{border-color:rgba(251,191,36,.38)}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:10px 12px;border-radius:18px;border:1px solid var(--line);animation:rise .35s var(--ease) both}
.bub.out{align-self:flex-end;background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(37,99,235,.14));border-color:rgba(56,189,248,.3);border-bottom-right-radius:6px}
.bub.in{align-self:flex-start;background:var(--glass2);border-bottom-left-radius:6px}
.bh{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:5px}.bh small{color:var(--dim);font-family:var(--mono);font-size:11px}
.bub code{display:block;font:12px/1.45 var(--mono);word-break:break-all;color:var(--sky)}.bub.in code{color:#a7f3d0}
.bub .bytes{display:block;text-align:right;color:var(--dim);font:10.5px var(--mono);margin-top:4px}
.group{border-radius:20px;border:1px solid var(--line);background:var(--glass);overflow:hidden;margin:12px 0}
.group>button,.group>.gi{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px}
.group>*:last-child{border-bottom:0}.group .ic{color:var(--sky)}.group span{flex:1}.group small{color:var(--muted);font-size:13px}.group .chev{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:22px 8px;font-size:14px}
</style>
</head>
